version: '3.8'

services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: bmsit_canteen_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canteen_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canteen_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-canteen_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canteen_user -d canteen_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis Server (Token Queues & Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: bmsit_canteen_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. Node.js Full-Stack Web Application (Express + React)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bmsit_canteen_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://canteen_user:canteen_secure_pass_2026@postgres:5432/canteen_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-bmsit_super_secret_jwt_key_2026}
    expose:
      - "3000"

  # 4. Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bmsit_canteen_nginx
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app

volumes:
  postgres_data:
  redis_data:
